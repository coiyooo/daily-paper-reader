subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: param-skills
      description: 面向真实机器人操作的参数化技能原语、技能条件化模仿学习与组合泛化检索
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: parameterized skill primitives
          keyword_cn: 参数化技能原语
          query: parameterized robot skill primitives with continuous parameters, preconditions, and effects for manipulation
        - keyword: skill-conditioned imitation learning
          keyword_cn: 技能条件化模仿学习
          query: imitation learning conditioned on skill identifiers and local phase identifiers for robot control
        - keyword: action chunking transformer
          keyword_cn: 动作分块Transformer
          query: action chunking transformer for predicting low-level continuous action sequences in robot manipulation
        - keyword: hierarchical imitation learning
          keyword_cn: 分层模仿学习
          query: hierarchical imitation learning for long-horizon tasks with reusable skill libraries
        - keyword: compositional generalization
          keyword_cn: 组合泛化
          query: compositional generalization of learned skills to unseen task sequences and object configurations
        - keyword: robot skill library
          keyword_cn: 机器人技能库
          query: reusable robot skill library for task and motion planning in contact-rich manipulation
      intent_queries:
        - query: >-
            How to represent long horizon manipulation tasks as reusable parameterized skill libraries and condition low
            level policies on skill IDs and local phases?
          query_cn: 如何将长时序操作任务表示为可复用参数化技能库，并基于技能ID和局部阶段信息条件化低层策略？
          enabled: true
          source: manual
          note: ''
        - query: >-
            Imitation learning with action chunking and Transformer for skill conditioned continuous robot control in
            contact rich tasks
          query_cn: 用于接触丰富任务中技能条件化连续机器人控制的动作分块Transformer模仿学习
          enabled: true
          source: manual
          note: ''
        - query: >-
            Compositional generalization of learned robot skills to novel sequences and object configurations with real
            robot experiments
          query_cn: 在真实机器人实验中学习技能对未见序列和物体位姿的组合泛化
          enabled: true
          source: manual
          note: ''
        - query: >-
            Integrating learned skill policies with state machines or behavior trees for failure recovery and safety
            constraints in manipulation
          query_cn: 将学习技能策略与状态机或行为树集成以实现操作中的失败恢复和安全约束
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-01T08:20:04.787Z'
